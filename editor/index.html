<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDIA 数据编辑器</title>
<style>
:root {
  /*
   * 极简配色：中性灰底 + 单一强调色。
   * 画布上的数据才是重点，界面本身不该抢戏 —— 所以不用渐变、不用发光、
   * 不做蓝黑科幻感，所有容器都是同一层灰。
   */
  --bg:    #0e0e0e;   /* 画布 */
  --bg2:   #161616;   /* 面板 */
  --bg3:   #1e1e1e;   /* 输入框 / 悬停 */
  --line:  #262626;
  --line2: #383838;
  --fg:    #ececec;
  --fg2:   #9c9c9c;
  --fg3:   #5f5f5f;

  --accent: #5b8def;
  --ok:   #5aa87a;
  --warn: #c9973f;
  --err:  #d95757;
  --info: #7c7c7c;

  /* JS 和画布绘制里引用了这两个名字，保留但指向中性色 */
  --cyan: var(--accent);
  --gold: var(--warn);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: transparent; border: 1px solid var(--line2); border-radius: 4px;
  padding: 5px 10px; cursor: pointer; white-space: nowrap; color: var(--fg2);
  transition: border-color .12s, color .12s, background .12s;
}
button:hover { border-color: #4a4a4a; color: var(--fg); }
button:active { background: var(--bg3); }
/*
 * ★ 激活态必须一眼看得出来。
 *   原来只有 14% 的蓝色底 + 蓝边框，在深色面板上和普通按钮几乎没区别 ——
 *   代码是对的，用户看不出来，就会觉得「点了没反应」。
 *   改成实心填充：「当前生效」值得用最强对比。
 */
button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
button.on:hover { background: #6d9bf5; }
button.primary { border-color: var(--accent); color: #cfdfff; }
button.primary:hover { background: rgba(91,141,239,.14); }
button.danger { color: var(--err); }
/*
 * 保存状态灯。常驻可见 —— 用户误点后退丢过东西，
 * 之后必须随时能一眼看出"我的改动在不在盘上"。
 */
.save-status {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--fg3);
  white-space: nowrap; user-select: none;
}
.save-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.save-status.saved { color: #6FCF97; border-color: rgba(111,207,151,.35); }
.save-status.dirty { color: var(--warn); border-color: rgba(240,180,90,.45); }
.save-status.saving { color: var(--accent); border-color: rgba(91,141,239,.45); }
.save-status.error { color: var(--err); border-color: rgba(255,110,110,.5); }
button.danger:hover { border-color: var(--err); }
button:disabled { opacity: .3; cursor: not-allowed; }
select, input[type=text], input[type=number] {
  background: var(--bg3); border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 7px; width: 100%; min-width: 0; color: var(--fg);
}
select:focus, input:focus { outline: none; border-color: var(--accent); }
input[type=checkbox] { width: auto; accent-color: var(--accent); }
code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
kbd {
  background: var(--bg3); border: 1px solid var(--line); border-radius: 3px;
  padding: 0 5px; font: 11px ui-monospace, monospace; color: var(--fg2);
}

#app {
  display: grid; height: 100vh;
  grid-template-columns: 256px 1fr 300px;
  grid-template-rows: 42px 1fr 22px;
  grid-template-areas: "tool tool tool" "left canvas right" "status status status";
}
#toolbar {
  grid-area: tool; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--bg2); border-bottom: 1px solid var(--line);
  /* ★ 模式按钮会一直加，工具栏必须能横向滚动，否则右边的按钮会被裁掉。 */
  overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
}
#toolbar > button, #toolbar > label, #toolbar > select, #toolbar > .sep { flex: none; }
#toolbar .brand { font-size: 12.5px; font-weight: 500; color: var(--fg2); letter-spacing: 0; }
#toolbar .sep { width: 1px; height: 18px; background: var(--line); }
#toolbar .spacer { flex: 1; }
#toolbar label { display: flex; align-items: center; gap: 5px; color: var(--fg3); font-size: 12px; white-space: nowrap; }
#toolbar label select { width: auto; }

aside { background: var(--bg2); overflow-y: auto; display: flex; flex-direction: column; }
#left { grid-area: left; border-right: 1px solid var(--line); }
#right { grid-area: right; border-left: 1px solid var(--line); }
aside section { border-bottom: 1px solid var(--line); padding: 10px 12px 12px; }
aside h3 {
  font-size: 12px; color: var(--fg2); font-weight: 500; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
main { grid-area: canvas; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
#status {
  grid-area: status; display: flex; align-items: center; gap: 14px; padding: 0 12px;
  background: var(--bg2); border-top: 1px solid var(--line);
  font: 11px ui-monospace, monospace; color: var(--fg3);
}
#status b { color: var(--fg2); font-weight: 400; }

/* ---- 列表项 ---- */
.row {
  display: flex; align-items: center; gap: 8px; padding: 4px 6px;
  border-radius: 4px; cursor: pointer; border: 1px solid transparent;
}
.row:hover { background: var(--bg3); }
.row.on { background: rgba(91,141,239,.12); border-color: rgba(91,141,239,.3); }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--fg3); font-size: 11px; font-family: ui-monospace, monospace; }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* ---- 表单 ---- */
.field { display: grid; grid-template-columns: 72px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
.field > label { color: var(--fg3); font-size: 11.5px; }
.field.wide { grid-template-columns: 1fr; }
.field .hint { grid-column: 2; color: var(--fg3); font-size: 10.5px; margin-top: -3px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.triple { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.note { color: var(--fg3); font-size: 11px; line-height: 1.55; }
.empty { color: var(--fg3); font-size: 12px; padding: 8px 2px; }
.pill { font-size: 11px; color: var(--fg3); font-variant-numeric: tabular-nums; }
.pill.ok { color: var(--ok); }
.pill.bad { color: var(--err); }

/* ---- 问题列表 ---- */
.issue { display: flex; gap: 7px; padding: 5px 6px; border-radius: 4px; cursor: pointer; align-items: flex-start; }
.issue:hover { background: var(--bg3); }
.issue .sev { flex: none; width: 5px; height: 5px; border-radius: 50%; margin-top: 6px; }
.issue.E .sev { background: var(--err); }
.issue.W .sev { background: var(--warn); }
.issue.I .sev { background: var(--info); }
.issue .m { flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.45; color: var(--fg2); }
.issue .c { color: var(--fg3); font: 10px ui-monospace, monospace; }

/* ---- 覆盖层 ---- */
#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 50; }
.toast {
  background: #202020; border: 1px solid var(--line2); border-radius: 5px;
  padding: 7px 13px; font-size: 12px; color: var(--fg);
  box-shadow: 0 8px 28px rgba(0,0,0,.55); animation: tin .15s ease; max-width: 60ch;
}
.toast.err { border-color: var(--err); }
.toast.ok { border-color: #3d5a48; }
@keyframes tin { from { opacity: 0; transform: translateY(5px); } }

#modal { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: none; place-items: center; z-index: 60; }
#modal.on { display: grid; }
#modal .box { background: var(--bg2); border: 1px solid var(--line2); border-radius: 6px; padding: 18px 20px; width: min(540px, 92vw); max-height: 86vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
#modal h2 { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
#modal .kb { display: grid; grid-template-columns: 120px 1fr; gap: 5px 12px; font-size: 12px; }
#modal .kb div:nth-child(odd) { color: var(--fg3); }

/* ---- 底图卡片 ---- */
.mapcard {
  border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px 9px;
  margin-bottom: 7px; cursor: pointer;
}
.mapcard:hover { border-color: var(--line2); }
.mapcard.on { border-color: var(--accent); }
.mapcard .head { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
.mapcard .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.mapcard .label {
  flex: 1; min-width: 0; background: transparent; border: 1px solid transparent;
  border-radius: 3px; padding: 2px 4px; font-size: 12px;
}
.mapcard .label:hover { border-color: var(--line2); }
.mapcard .label:focus { border-color: var(--accent); background: var(--bg3); }
.mapcard .file { margin: 0 0 6px 11px; font-size: 10px; color: var(--fg3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mapcard .field { grid-template-columns: 62px 1fr; margin-bottom: 4px; }
.mapcard .field > label { font-size: 10.5px; }
.mapcard input[type=number] { padding: 3px 6px; font-size: 12px; }
.mapcard .actions { margin-top: 6px; gap: 5px; }
.mapcard .actions button { padding: 3px 8px; font-size: 11px; }
button.mini { padding: 1px 5px; font-size: 11px; line-height: 1.4; border-radius: 3px; color: var(--fg3); }
button.mini:hover { color: var(--fg); }
button.mini.danger { padding: 1px 6px; }

/* ---- 图例 ---- */
#legend { font-size: 11px; }
#legend .grp { margin-bottom: 9px; }
#legend .grp:last-child { margin-bottom: 0; }
#legend .gt { font-size: 11.5px; color: var(--fg2); margin-bottom: 2px; }
#legend .gn { font-size: 10px; color: var(--fg3); line-height: 1.5; margin-bottom: 5px; }
#legend .it { display: flex; align-items: center; gap: 7px; padding: 1px 0; }
#legend .it svg { flex: none; }
#legend .it .nm { flex: 1; min-width: 0; color: var(--fg2); }
#legend .it .nm b { font-weight: 400; color: var(--fg); }
#legend .it .nm .sub { font-size: 9.5px; color: var(--fg3); }

/*
 * 提示条浮在画布上方，所以整块设成 pointer-events:none —— 不想让它挡住下面的拖动和绘制。
 *
 * ★ 但 pointer-events 是【继承】属性：只写容器会让里面的 <select> 也变成不可点，
 *   点击直接穿透到画布上，于是在地图上画出了点。
 *   所以必须给里面的交互控件单独恢复 auto。
 *   （editor-boot.mjs 有一条测试专门守着这条规则。）
 */
#hint {
  position: absolute; left: 12px; top: 10px; pointer-events: none;
  background: rgba(22,22,22,.94); border: 1px solid var(--line2); border-radius: 5px;
  padding: 7px 10px; font-size: 12px; max-width: 60ch; line-height: 1.6; display: none;
  color: var(--fg2);
}
#hint.on { display: block; }
#hint .k { color: var(--fg3); }
#hint select, #hint button, #hint input, #hint label, #hint a { pointer-events: auto; }
#hint select { cursor: pointer; }
#hint .row { pointer-events: auto; }
</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <span class="brand">BDIA 数据编辑器</span>
    <span class="sep"></span>
    <span id="modes" style="display:flex;gap:6px"></span>
    <span class="sep"></span>
    <label>隔离区 <select id="zoneSel" style="width:auto"></select></label>
    <label style="gap:4px"><input type="checkbox" id="snapChk" checked> 吸附</label>
    <label style="gap:4px"><input type="checkbox" id="gridChk"> 网格</label>
    <span class="spacer"></span>
    <button id="btnUndo" title="撤销 Ctrl+Z">↶</button>
    <button id="btnRedo" title="重做 Ctrl+Shift+Z">↷</button>
    <button id="btnFit" title="适应视图（0）">适应</button>
    <button id="btnDel" class="danger" title="删除选中 Delete">删除</button>
    <button id="btnSave" class="primary" title="保存 Ctrl+S">保存</button>
    <button id="btnValidate" title="跑校验器">校验</button>
    <button id="btnHelp" title="快捷键 ?">?</button>
  </header>

  <aside id="left">
    <section>
      <h3>楼层 <span class="pill" id="levelHint"></span></h3>
      <div id="levelList"></div>
    </section>
    <section>
      <h3>平面图与校准</h3>
      <div id="calibPanel"></div>
    </section>
    <section>
      <h3>图层</h3>
      <div id="layerList"></div>
    </section>
    <section>
      <h3>图例 <span class="pill" id="legendHint"></span></h3>
      <div id="legend"></div>
    </section>
    <section style="border-bottom:none">
      <h3>统计</h3>
      <div id="stats" class="note"></div>
    </section>
  </aside>

  <main>
    <canvas id="cv"></canvas>
    <div id="hint"></div>
  </main>

  <aside id="right">
    <section>
      <h3>属性 <span class="pill" id="selHint">未选中</span></h3>
      <div id="props"></div>
    </section>
    <section style="border-bottom:none">
      <h3>问题 <span class="pill" id="issueCount">—</span></h3>
      <div id="issues"><div class="empty">点右上角「校验」跑一遍。</div></div>
    </section>
  </aside>

  <footer id="status">
    <span>坐标 <b id="stCoord">—</b></span>
    <span>比例 <b id="stScale">—</b></span>
    <span>缩放 <b id="stZoom">—</b></span>
    <span id="stSnap"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="stMode"></span>
    <span id="stDirty"></span>
  </footer>
</div>

<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<!-- ▼ 启动失败诊断层。默认隐藏，由下面的守卫脚本决定要不要显示。 -->
<div id="bootError">
  <div class="card">
    <h1 id="beTitle">编辑器没能启动</h1>
    <div class="detail" id="beDetail"></div>
    <div class="extra" id="beExtra"></div>
  </div>
</div>

<style>
#bootError { display: none; position: fixed; inset: 0; z-index: 200; background: #0e0e0e;
  place-items: center; padding: 24px; overflow-y: auto; }
#bootError.on { display: grid; }
#bootError .card { background: #161616; border: 1px solid #383838; border-radius: 6px;
  padding: 24px 28px; max-width: 700px; width: 100%; line-height: 1.75; }
#bootError h1 { font-size: 17px; font-weight: 500; margin-bottom: 14px; color: #d95757; }
#bootError .detail { color: #ececec; margin-bottom: 16px; }
#bootError .extra { color: #9c9c9c; font-size: 12.5px; }
#bootError code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  background: #1e1e1e; border: 1px solid #383838; border-radius: 3px; padding: 1px 6px; color: #5b8def; }
#bootError pre { font-family: ui-monospace, Consolas, monospace; background: #0e0e0e;
  border: 1px solid #383838; border-radius: 4px; padding: 12px 14px; margin: 10px 0;
  color: #c9973f; overflow-x: auto; font-size: 13px; }
#bootError ul { margin: 8px 0 0 20px; }
#bootError li { margin-bottom: 5px; }
#bootError .ok { color: #5aa87a; }
</style>

<script>
/*
 * 启动守卫。★ 这是普通 script（不是 module），所以从 file:// 打开也能执行 ——
 * 而 <script type="module"> 在 file:// 下会被 CORS 直接拦掉，页面一片空白、没有任何提示。
 * 这一段负责把「为什么起不来」说清楚，而不是让你对着空白页猜。
 */
(function () {
  var SRC = './app.js';
  var shown = false;   // ★ 一旦报过就不再覆盖：先到的诊断更具体，别让看门狗把它冲掉

  function fail(title, detailHtml, extraHtml) {
    var box = document.getElementById('bootError');
    if (!box) return;
    if (shown) return;                       // 已经有一条更具体的诊断了
    shown = true;
    document.getElementById('beTitle').textContent = title;
    document.getElementById('beDetail').innerHTML = detailHtml;
    document.getElementById('beExtra').innerHTML = extraHtml || '';
    box.classList.add('on');
  }
  window.__bdiaFail = fail;

  // ① 最常见的误操作：直接双击 index.html
  if (location.protocol === 'file:') {
    fail(
      '这个编辑器不能直接用 file:// 打开',
      '它由两部分组成：一个画布界面，和一个负责读写 <code>data/source/</code>、调用校验器的本地服务。'
      + '双击 HTML 只打开了界面，服务没起，而且浏览器会以 CORS 为由拒绝加载 ES 模块 —— 所以是空白页。',
      '<b>正确打开方式（二选一）：</b>'
      + '<ul>'
      + '<li>回到 <code>projects/bdia-nav</code> 目录，<b>双击 <code>启动编辑器.cmd</code></b></li>'
      + '<li>或者在命令行里跑 <code>npm run editor</code></li>'
      + '</ul>'
      + '<p style="margin-top:14px">跑起来之后浏览器会自动打开 <code>http://127.0.0.1:5173/editor/</code>，用那个地址。</p>'
      + '<p style="margin-top:10px">提示：<code>file://</code> 下浏览器连 <code>data/source/</code> 里的数据都读不到，'
      + '所以这不是「换个浏览器试试」能解决的问题。</p>'
    );
    return;
  }

  // ② 模块本身加载失败（服务器没起 / 路径不对 / 404）
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      fail(
        '加载 ' + SRC + ' 失败',
        '脚本没能取回来。多半是本地服务没在跑，或者端口不对。',
        '<b>检查：</b>'
        + '<ul>'
        + '<li>跑 <code>npm run editor</code> 的服务窗口是不是被关掉了？</li>'
        + '<li>地址对不对？应该是 <code>http://127.0.0.1:5173/editor/</code></li>'
        + '<li>5173 端口被占用的话，换一个：<code>node tools/editor-server.mjs --port 5174</code></li>'
        + '</ul>'
      );
    }
  }, true);

  // ③ 模块加载了但 boot 卡住或抛错 —— 看门狗兜底。
  //    只在「前面没报过错」时才说话，否则会把更具体的诊断冲掉。
  setTimeout(function () {
    if (window.__bdiaBooted || shown) return;
    fail(
      '编辑器没能启动',
      '脚本已经加载，但初始化没有完成。按 <code>F12</code> 打开控制台看红色报错。',
      '<b>常见原因：</b>'
      + '<ul>'
      + '<li><code>data/source/manifest.json</code> 语法错误 —— 跑 <code>npm run validate</code> 会指出具体位置</li>'
      + '<li>面板渲染出错 —— 界面上方会有一条红色横幅说明是哪个面板</li>'
      + '<li>改了 <code>editor/</code> 下的代码 —— 跑 <code>npm run editor:boot</code> 会告诉你界面还能不能起来</li>'
      + '</ul>'
    );
  }, 4000);
})();
</script>

<script type="module" src="./app.js"></script>
</body>
</html>
